[project]
name = "sei-trends"
version = "0.1.0"
description = "Search SEI research papers, extract highlights/limitations with Claude, and forecast future research priorities."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8.0", "pydantic>=2.6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sei-trends = "sei_trends.cli:main"

[tool.setuptools]
packages = ["sei_trends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
